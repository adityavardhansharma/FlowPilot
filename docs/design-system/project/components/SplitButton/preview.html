<div class="fp-col">
  <div class="fp-row" style="gap:2px">
    <button class="btn filled sl" style="border-radius:999px 8px 8px 999px"><span class="ms ">arrow_upward</span>Send now</button>
    <button class="btn filled sl" style="border-radius:8px 999px 999px 8px;padding:0 12px" aria-label="Send options" aria-haspopup="menu"><span class="ms ">keyboard_arrow_down</span></button>
  </div>
  <div class="card hi" style="width:240px;padding:8px 0;border-radius:16px">
    <div class="li" style="background:none;min-height:48px"><span class="ms ">bolt</span><div class="body"><div class="t">Send now</div><div class="s">Steers the running turn</div></div></div>
    <div class="li" style="background:none;min-height:48px"><span class="ms ">schedule_send</span><div class="body"><div class="t">Send when finished</div><div class="s">Adds to the queue</div></div></div>
  </div>
</div>
