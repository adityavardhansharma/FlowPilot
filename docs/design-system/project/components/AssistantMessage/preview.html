<div style="max-width:420px">
  <div class="msg-ai" id="ai"></div>
  <div class="fp-cap" style="margin-top:4px" id="stats"></div>
</div>
<script>
const parts=["The loop comes from ","<code>redirectUri</code>"," being built from the request host. ","Behind the proxy that host is <code>localhost</code>, ","so Google sends you back to a URL the session cookie doesn't match.</p><p>","I changed it to read <code>PUBLIC_URL</code> and added a test for the proxied case."];
const el=document.getElementById('ai');let i=0,buf="<p>";
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick(){buf+=parts[i++];el.innerHTML=buf+(i<parts.length?'<span class="caret"></span>':'')+'</p>';if(i<parts.length)setTimeout(tick,reduce?0:420);else document.getElementById('stats').textContent='Claude Opus 5 · 12.4k tokens · $0.42 · 1m 12s';}
tick();
</script>
