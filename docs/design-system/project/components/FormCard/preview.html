<!-- @dsCard group="Human in the loop" height=420 -->
<div class="card" style="max-width:420px;background:var(--surface-container-low);box-shadow:inset 0 0 0 2px var(--tertiary)">
  <div class="fp-row" style="gap:8px;font:500 12px/16px var(--font-brand);color:var(--on-surface-variant)"><span class="ms s18" style="color:var(--tertiary)">help</span>The agent has a question</div>
  <div style="font:600 16px/24px var(--font-brand);margin:8px 0 12px">Which database should the migration target?</div>
  <div class="list" style="margin-bottom:12px">
    <div class="li sl sel" style="min-height:48px"><span class="ms fill">radio_button_checked</span><div class="body"><div class="t">Postgres 16</div><div class="s">Matches production</div></div></div>
    <div class="li sl" style="min-height:48px"><span class="ms">radio_button_unchecked</span><div class="body"><div class="t">SQLite</div><div class="s">Local only</div></div></div>
  </div>
  <div style="height:56px;border-radius:4px 4px 0 0;background:var(--surface-container-highest);box-shadow:inset 0 -1px 0 var(--on-surface-variant);padding:8px 16px;margin-bottom:16px"><div style="font:400 12px/16px var(--font-brand);color:var(--on-surface-variant)">Anything else? (optional)</div></div>
  <div class="fp-row" style="justify-content:flex-end;gap:8px"><button class="btn textbtn sl">Skip</button><button class="btn filled sl">Send answer</button></div>
</div>
