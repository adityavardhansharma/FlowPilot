<!-- @dsCard group="Human in the loop" height=200 -->
<div class="card" style="max-width:420px;background:var(--error-container);color:var(--on-error-container);display:flex;gap:12px">
  <span class="ms" style="color:var(--on-error-container)">error</span>
  <div style="flex:1"><div style="font:500 16px/24px var(--font-brand)">The model returned an error</div><div style="font:400 14px/20px var(--font-brand);margin:4px 0 12px">Rate limit reached for Claude Opus 5. Try again in a minute or pick another model.</div>
  <div class="fp-row" style="gap:8px"><button class="btn sl" style="background:var(--on-error-container);color:var(--error-container)">Retry</button><button class="btn sl" style="box-shadow:inset 0 0 0 1px var(--on-error-container);color:var(--on-error-container)">Change model</button></div></div>
</div>
