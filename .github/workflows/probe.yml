name: probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/maven-metadata.xml | grep -o '<version>9[^<]*' | sed 's/<version>//' | grep -v -- '-' | tail -8
          curl -s https://dl.google.com/dl/android/maven2/androidx/compose/compose-bom/2026.09.00/compose-bom-2026.09.00.pom | grep -A1 'material3</artifactId>\|<artifactId>ui</artifactId>' | head
          curl -s https://dl.google.com/dl/android/maven2/androidx/navigation/navigation-compose/maven-metadata.xml | grep -o '<version>[^<]*' | tail -3
          java -version 2>&1 | head -2
