name: Release

# Runs only when started by hand: Actions → Release → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 0.2.0. Leave blank to bump the patch of the latest v* tag (0.1.0 if none)."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Pick the version
        run: |
          git fetch --tags --quiet
          VERSION="$(echo "${VERSION#v}" | xargs)"
          if [ -z "$VERSION" ]; then
            # One click: bump the patch of the newest plain vX.Y.Z tag; pre-release tags don't count.
            LATEST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "$LATEST" ]; then
              VERSION=0.1.0
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
            echo "No version given; latest tag is ${LATEST:-none}, releasing $VERSION."
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-beta.1, got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Check the tag is new
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Pick a new version."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          # The open-source cache on GitHub's own cache storage, as v4 used; v6 defaults to a commercial provider.
          cache-provider: basic

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWPILOT_KEYSTORE_BASE64 }}
        run: |
          # A release must be signed with the release key: every runner makes a fresh debug key, and an APK signed
          # with a different key can't install over the one people already have.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::No FLOWPILOT_KEYSTORE_BASE64 secret. Add the release keystore secrets (see docs/releasing.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FLOWPILOT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build release APK
        env:
          FLOWPILOT_KEYSTORE_PASSWORD: ${{ secrets.FLOWPILOT_KEYSTORE_PASSWORD }}
          FLOWPILOT_KEY_ALIAS: ${{ secrets.FLOWPILOT_KEY_ALIAS }}
          FLOWPILOT_KEY_PASSWORD: ${{ secrets.FLOWPILOT_KEY_PASSWORD }}
        run: |
          ./gradlew :core:test :app:assembleRelease --stacktrace \
            -Pflowpilot.versionName="$VERSION" \
            -Pflowpilot.versionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "FlowPilot-$VERSION.apk"

      - name: Show the signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "FlowPilot-$VERSION.apk" | grep -m1 "SHA-256 digest" | awk '{print $NF}')
          echo "Signed with certificate SHA-256 $CERT"
          echo "Release signed with certificate SHA-256 \`$CERT\`, version code ${{ github.run_number }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=(--title "FlowPilot $VERSION" --generate-notes --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "FlowPilot-$VERSION.apk" "${flags[@]}"
