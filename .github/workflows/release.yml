name: Release

# Runs only when started by hand: Actions → Release → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version
        run: |
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-beta.1, got '$VERSION'"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Check the tag is new
        run: |
          git fetch --tags --quiet
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Pick a new version."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FLOWPILOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FLOWPILOT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No FLOWPILOT_KEYSTORE_BASE64 secret. The APK is signed with a debug key."
          fi

      - name: Test and build release APK
        env:
          FLOWPILOT_KEYSTORE_PASSWORD: ${{ secrets.FLOWPILOT_KEYSTORE_PASSWORD }}
          FLOWPILOT_KEY_ALIAS: ${{ secrets.FLOWPILOT_KEY_ALIAS }}
          FLOWPILOT_KEY_PASSWORD: ${{ secrets.FLOWPILOT_KEY_PASSWORD }}
        run: |
          ./gradlew :core:test :app:assembleRelease --stacktrace \
            -Pflowpilot.versionName="$VERSION" \
            -Pflowpilot.versionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "FlowPilot-$VERSION.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=(--title "FlowPilot $VERSION" --generate-notes --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "FlowPilot-$VERSION.apk" "${flags[@]}"
